
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>AeroRoute</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body, #globe {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080e1c;
    }

    .marker {
      color: white;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #60a5fa;
      border-radius: 6px;
      padding: 5px 8px;
      font: 600 11px Arial, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }

    .airport {
      border-color: #22c55e;
    }

    .aircraft {
      width: 32px;
      height: 32px;
      color: #ffffff;
      filter: drop-shadow(0 0 5px #38bdf8);
      pointer-events: none;
    }

    .aircraft svg {
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: center;
    }

    .coordinate {
      width: 5px;
      height: 5px;
      border: 1px solid #a5f3fc;
      border-radius: 50%;
      background: #38bdf8;
      pointer-events: none;
    }

    #error {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font: 14px Arial, sans-serif;
    }
  </style>
</head>

<body>
  <div id="globe"></div>
  <div id="error"></div>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2"></script>

  <script>
    let world;
    let route = [];
    let aircraft = null;
    let followAircraft = false;
    let aircraftElement = null;
    // A linha e o centro do ícone devem ocupar a mesma superfície.
    const ROUTE_ALTITUDE = 0.012;

    function send(type, payload = {}) {
      window.parent.postMessage(
        { type, ...payload },
        window.location.origin
      );
    }

    function createMarker(point) {
      const element = document.createElement("div");

      if (point.type === "aircraft") {
        element.className = "aircraft";
        element.innerHTML = '<svg viewBox="0 0 32 32" aria-label="Aeronave"><path fill="currentColor" stroke="#0f172a" stroke-width="1" d="M16 2 L19 13 L29 20 L29 23 L19 20 L18 26 L22 29 L22 31 L16 29 L10 31 L10 29 L14 26 L13 20 L3 23 L3 20 L13 13 Z"/></svg>';
        aircraftElement = element;
      } else if (point.type === "coordinate") {
        // Coordenadas continuam visíveis sem dezenas de rótulos sobrepostos.
        element.className = "coordinate";
        element.title = `${point.ident} (coordenada calculada)`;
      } else {
        element.className =
          point.type === "airport"
            ? "marker airport"
            : "marker";

        element.textContent = point.ident;
      }

      return element;
    }

    function updateMarkers() {
      if (!world) return;

      const markers = [...route];

      if (aircraft) {
        markers.push(aircraft);
      }

      world.htmlElementsData(markers);
    }

    function updateAircraftHeading() {
      if (!aircraftElement || !aircraft?.ahead) return;
      const current = world.getScreenCoords(aircraft.lat, aircraft.lng, ROUTE_ALTITUDE);
      const ahead = world.getScreenCoords(aircraft.ahead.lat, aircraft.ahead.lng, ROUTE_ALTITUDE);
      const dx = ahead.x - current.x;
      const dy = ahead.y - current.y;
      if (Math.hypot(dx, dy) > 0.001) {
        aircraftElement.firstElementChild.style.transform =
          `rotate(${Math.atan2(dx, -dy) * 180 / Math.PI}deg)`;
      }
    }

    function setRoute(points, path) {
      if (!world) return;

      route = points;
      aircraft = null;
      aircraftElement = null;

      world.pointsData(
        points
          .filter(point => point.type === "airport")
          .map(point => ({
            lat: point.lat,
            lng: point.lng
          }))
      );

      if (points.length >= 2) {
        world.pathsData([{
          coords: path.map(point => [
            point.lat,
            point.lng
          ])
        }]);

        world.pointOfView({
          lat: points[0].lat,
          lng: points[0].lng,
          altitude: 2.2
        }, 1200);
      }

      updateMarkers();
    }

    function updateAircraft(data) {
      if (!world || !route.length) return;

      // Preserve o objeto e o elemento entre frames para evitar recriá-los.
      aircraft ??= { ident: "AIRCRAFT", type: "aircraft" };
      Object.assign(aircraft, {
        lat: data.lat,
        lng: data.lng,
        ahead: data.ahead
      });

      followAircraft = data.follow;

      updateMarkers();
      requestAnimationFrame(updateAircraftHeading);

      if (followAircraft) {
        world.pointOfView({
          lat: aircraft.lat,
          lng: aircraft.lng,
          altitude: 1.35
        }, 0);
      }
    }

    function resetGlobe() {
      if (!world) return;

      route = [];
      aircraft = null;
      aircraftElement = null;
      followAircraft = false;

      world.pathsData([]);
      world.pointsData([]);
      world.htmlElementsData([]);

      world.pointOfView({
        lat: -15,
        lng: -40,
        altitude: 2.7
      }, 800);
    }

    function initialize() {
      if (typeof Globe === "undefined") {
        document.getElementById("error").textContent =
          "Não foi possível carregar o Globe.GL.";

        send("ERROR", {
          message: "Falha no carregamento do Globe.GL."
        });

        return;
      }

      world = new Globe(
        document.getElementById("globe"),
        { animateIn: false }
      )
        .width(window.innerWidth)
        .height(window.innerHeight)

        .backgroundColor("#080e1c")

        .globeImageUrl(
          "https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg"
        )

        .bumpImageUrl(
          "https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png"
        )

        .pointOfView({
          lat: -15,
          lng: -40,
          altitude: 2.7
        })

        .pointsData([])
        .pointColor(() => "#22c55e")
        .pointRadius(0.3)
        .pointAltitude(0.02)

        .pathsData([])
        .pathPoints("coords")
        .pathPointAlt(ROUTE_ALTITUDE)
        // O React já enviou a curva esférica amostrada. Não interpolar lat/lng.
        .pathResolution(Infinity)
        .pathTransitionDuration(0)
        .pathColor(() => "#38bdf8")
        .pathStroke(0.45)

        .htmlElementsData([])
        .htmlLat("lat")
        .htmlLng("lng")
        .htmlAltitude(ROUTE_ALTITUDE)
        .htmlElement(createMarker)
        .htmlTransitionDuration(0);

      world.controls().addEventListener("change", updateAircraftHeading);

      window.addEventListener("resize", () => {
        world
          .width(window.innerWidth)
          .height(window.innerHeight);
      });

      send("READY");
    }

    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin) {
        return;
      }

      const message = event.data;

      if (!message || typeof message.type !== "string") {
        return;
      }

      switch (message.type) {
        case "ROUTE":
          setRoute(message.points, message.path);
          break;

        case "AIRCRAFT":
          updateAircraft(message);
          break;

        case "RESET":
          resetGlobe();
          break;

        case "OVERVIEW":
          if (route.length) {
            world.pointOfView({
              lat: route[0].lat,
              lng: route[0].lng,
              altitude: 2.7
            }, 800);
          }
          break;
      }
    });

    initialize();
  </script>
</body>
</html>
